<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arena Shooter</title>
<style>
  :root{
    --bg:#0b0e14; --panel:#141922cc; --text:#eef2f8; --muted:#8b96a8;
    --accent:#5eead4; --danger:#ff5d6c;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;background:var(--bg);overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:var(--text)}
  canvas{display:block;width:100%;height:100%;touch-action:none}
  #hud{position:fixed;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;pointer-events:none;font-size:13px}
  #hud .box{background:var(--panel);padding:8px 12px;border-radius:10px;backdrop-filter:blur(6px)}
  #hp{width:140px;height:10px;background:#222;border-radius:5px;overflow:hidden;margin-top:4px}
  #hpfill{height:100%;background:var(--accent);width:100%;transition:width .15s}
  #status{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);
    background:var(--panel);padding:8px 16px;border-radius:20px;font-size:13px;color:var(--muted);pointer-events:none}
  #joinbar{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b0e14e8;z-index:10}
  #joinbar .card{background:var(--panel);padding:28px;border-radius:16px;text-align:center;max-width:320px}
  #joinbar input{width:100%;padding:10px 12px;border-radius:8px;border:1px solid #2a3140;background:#0f1420;color:var(--text);font-size:15px;margin:12px 0}
  #joinbar button{width:100%;padding:11px;border-radius:8px;border:none;background:var(--accent);color:#0b0e14;font-weight:600;font-size:15px;cursor:pointer}
  #joinbar button:disabled{opacity:.5;cursor:default}
  #joinbar h1{font-size:18px;margin:0 0 4px}
  #joinbar p{color:var(--muted);font-size:13px;margin:0}
  #deadmsg{position:fixed;top:45%;left:50%;transform:translate(-50%,-50%);font-size:22px;font-weight:700;color:var(--danger);pointer-events:none;display:none}
  #killfeed{position:fixed;top:56px;right:12px;display:flex;flex-direction:column;gap:4px;align-items:flex-end;pointer-events:none;font-size:12px}
  #killfeed div{background:#0000009a;padding:4px 10px;border-radius:6px;opacity:0;animation:kf 4s ease forwards}
  @keyframes kf{0%{opacity:0;transform:translateX(10px)}8%{opacity:1;transform:translateX(0)}80%{opacity:1}100%{opacity:0}}
  #announce{position:fixed;top:30%;left:50%;transform:translate(-50%,-50%);font-size:30px;font-weight:800;letter-spacing:1px;color:var(--accent);text-shadow:0 2px 12px #000;pointer-events:none;opacity:0}
  #announce.show{animation:an 1.6s ease forwards}
  @keyframes an{0%{opacity:0;transform:translate(-50%,-50%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}30%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
  #flash{position:fixed;inset:0;pointer-events:none;background:transparent}
  #hitmarker{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:26px;color:#fff;opacity:0;pointer-events:none}
  #hitmarker.show{animation:hm .35s ease forwards}
  @keyframes hm{0%{opacity:1;transform:translate(-50%,-50%) scale(1.4)}100%{opacity:0;transform:translate(-50%,-50%) scale(.9)}}
  #scoreboard{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:#0d1119ee;border:1px solid #2a3140;
    border-radius:14px;padding:18px 22px;min-width:260px;display:none;pointer-events:none;backdrop-filter:blur(8px)}
  #scoreboard h2{margin:0 0 10px;font-size:15px;color:var(--muted);text-align:center;letter-spacing:.5px}
  #scoreboard .row{display:flex;justify-content:space-between;padding:5px 4px;font-size:14px;border-radius:6px}
  #scoreboard .row.me{background:#5eead422}
  #scoreboard .row span:first-child{color:var(--text)}
  #scoreboard .row span:last-child{color:var(--accent);font-weight:700}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="musicControl" style="position:fixed;top:64px;left:12px;z-index:5;pointer-events:auto;display:flex;gap:5px;align-items:center;background:#141922cc;padding:6px;border:1px solid #2a3140;border-radius:10px">
  <button id="prevMusic" title="Poprzednia" style="background:#141922;color:#eef2f8;border:1px solid #2a3140;padding:5px 8px;border-radius:7px;cursor:pointer">⏮</button>
  <button id="musicBtn" style="background:#141922;color:#eef2f8;border:1px solid #2a3140;padding:5px 9px;border-radius:7px;cursor:pointer;font-size:12px">🔊 ON</button>
  <button id="nextMusic" title="Następna" style="background:#141922;color:#eef2f8;border:1px solid #2a3140;padding:5px 8px;border-radius:7px;cursor:pointer">⏭</button>
  <span id="trackName" style="color:#eef2f8;font:12px Arial,sans-serif;min-width:70px;text-align:center">Utwór 1/5</span>
</div>
<div id="hud">
  <div class="box">Ty<br><div id="hp"><div id="hpfill"></div></div></div>
  <div class="box">Zabójstwa: <span id="kills">0</span></div>
</div>
<div id="effects" style="position:fixed;left:12px;bottom:50px;display:flex;gap:6px;pointer-events:none"></div>
<div id="deadmsg">Zginąłeś — odradzasz się...</div>
<div id="killfeed"></div>
<div id="announce"></div>
<div id="hitmarker">✕</div>
<div id="flash"></div>
<div id="scoreboard"><h2>WYNIKI (Tab)</h2></div>
<div id="status">Łączenie z serwerem...</div>
<div id="joinbar">
  <div class="card">
    <h1>Arena Shooter</h1>
    <p>WASD — ruch, mysz — celowanie, klik — strzał</p>
    <input id="nameInput" maxlength="14" placeholder="Twoja nazwa">
    <button id="joinBtn" disabled>Łączenie...</button>
  </div>
</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
function resize(){canvas.width=innerWidth;canvas.height=innerHeight;}
resize(); addEventListener('resize', resize);

const COLORS = ['#5eead4','#ff5d6c','#facc15','#818cf8','#fb923c','#4ade80','#f472b6','#38bdf8'];
const ARENA = {w: 2000, h: 1400};
const POWERUP_TYPES = {
  heal:   {color:'#4ade80', icon:'➕'},
  speed:  {color:'#facc15', icon:'👟'},
  damage: {color:'#f472b6', icon:'🗡️'}
};
const STREAK_NAMES = {2:'PODWÓJNE ZABÓJSTWO', 3:'POTRÓJNE ZABÓJSTWO', 4:'DOMINACJA', 5:'RAMPAGE!'};
const SHOOT_COOLDOWN = 260, BULLET_SPEED = 640, BULLET_LIFE = 1400, PLAYER_R = 16, BULLET_R = 4, SPEED = 260;

let me = null, peers = {}, bullets = {}, activePowerups = {}, claimed = new Set();
let keys = {}, mouse = {x:0,y:0}, lastShot = 0, lastPresence = 0, lastSpawnCheck = 0;
let ws = null, pending = null, firing = false, showScore = false;
bullets = []; // {x,y,vx,vy,ownerId,ownerColor,ownerName,born,dmg}

// --- obstacles (same on every client, no sync needed) ---
const OBSTACLES = [
  {x:300,y:300,w:170,h:60}, {x:900,y:160,w:60,h:220}, {x:1550,y:380,w:150,h:150},
  {x:560,y:780,w:230,h:60}, {x:1220,y:880,w:60,h:230}, {x:1720,y:980,w:160,h:110},
  {x:100,y:1080,w:150,h:150}, {x:980,y:600,w:110,h:110}, {x:1400,y:150,w:150,h:60},
  {x:200,y:650,w:60,h:180}
];
function circleRectCollide(cx, cy, r, rect){
  const closestX = Math.max(rect.x, Math.min(cx, rect.x+rect.w));
  const closestY = Math.max(rect.y, Math.min(cy, rect.y+rect.h));
  const dx = cx-closestX, dy = cy-closestY;
  return (dx*dx+dy*dy) < r*r;
}
function bulletHitsObstacle(x1,y1,x2,y2,r){
  for(const o of OBSTACLES){
    for(let i=0;i<=4;i++){
      const t=i/4, x=x1+(x2-x1)*t, y=y1+(y2-y1)*t;
      if(circleRectCollide(x,y,r,o)) return true;
    }
  }
  return false;
}

function rand(a,b){return a+Math.random()*(b-a);}
function segmentHitsCircle(x1,y1,x2,y2,cx,cy,r){
  const dx=x2-x1, dy=y2-y1;
  const lenSq = dx*dx+dy*dy;
  let t = lenSq>0 ? ((cx-x1)*dx+(cy-y1)*dy)/lenSq : 0;
  t = Math.max(0, Math.min(1, t));
  const px = x1+t*dx, py = y1+t*dy;
  return Math.hypot(px-cx, py-cy) <= r;
}
function myId(){return me ? me.id : null;}
function spawnPos(){
  for(let i=0;i<20;i++){
    const x = rand(80, ARENA.w-80), y = rand(80, ARENA.h-80);
    if(!OBSTACLES.some(o=>circleRectCollide(x,y,PLAYER_R+10,o))) return {x,y};
  }
  return {x: rand(80, ARENA.w-80), y: rand(80, ARENA.h-80)};
}


// --- muzyka / PLAYLISTA ---
const playlist = [
  '/music/song1.mp3',
  '/music/song2.mp3',
  '/music/song3.mp3',
  '/music/song4.mp3',
  '/music/song5.mp3'
];

const music = new Audio();
music.volume = 0.35;
musicEnabled = true;
let currentTrack = 0;

function setTrack(index, autoplay=true){
  if(!playlist.length) return;
  currentTrack = (index + playlist.length) % playlist.length;
  music.src = playlist[currentTrack];
  music.load();
  updateMusicLabel();
  if(autoplay && musicEnabled) music.play().catch(()=>{});
}

function startMusic(){
  if(!musicEnabled || !playlist.length) return;
  if(!music.src) setTrack(currentTrack, false);
  music.play().catch(()=>{});
}

function nextTrack(){
  setTrack(currentTrack + 1);
}

function previousTrack(){
  setTrack(currentTrack - 1);
}

function toggleMusic(){
  musicEnabled = !musicEnabled;
  const btn = document.getElementById('musicBtn');
  if(musicEnabled){
    btn.textContent = '🔊 Muzyka: ON';
    startMusic();
  } else {
    music.pause();
    btn.textContent = '🔇 Muzyka: OFF';
  }
}

function updateMusicLabel(){
  const label = document.getElementById('trackName');
  if(label) label.textContent = `Utwór ${currentTrack + 1}/${playlist.length}`;
}

music.addEventListener('ended', nextTrack);

function connect(){
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  ws = new WebSocket(proto + '://' + location.host);
  const status = document.getElementById('status');
  const btn = document.getElementById('joinBtn');
  ws.onopen = () => { status.textContent = 'Połączono. Wpisz nazwę i dołącz.'; btn.disabled = false; btn.textContent = 'Dołącz do areny'; };
  ws.onclose = () => { status.textContent = 'Rozłączono z serwerem.'; btn.disabled = true; };
  ws.onerror = () => { status.textContent = 'Błąd połączenia z serwerem.'; };
  ws.onmessage = (ev) => {
    let msg; try{ msg = JSON.parse(ev.data); } catch { return; }
    handleMessage(msg);
  };
}

function send(t, data){ if(ws && ws.readyState===1) ws.send(JSON.stringify(Object.assign({t}, data))); }

function handleMessage(msg){
  if(msg.t === 'welcome' && pending){
    me = {id: msg.id, name: pending.name, x: pending.x, y: pending.y, angle:0, hp:100,
          color: pending.color, kills:0, streak:0, speedUntil:0, dmgUntil:0};
    peers = {};
    for(const p of msg.players) peers[p.id] = p;
    activePowerups = {};
    for(const p of msg.powerups) activePowerups[p.id] = {x:p.x, y:p.y, type:p.type};
    pending = null;
    document.getElementById('joinbar').style.display = 'none';
  } else if(msg.t === 'presence'){
    peers[msg.id] = msg;
  } else if(msg.t === 'leave'){
    delete peers[msg.id];
  } else if(msg.t === 'shoot'){
    bullets.push({x:msg.x,y:msg.y,vx:Math.cos(msg.a)*BULLET_SPEED,vy:Math.sin(msg.a)*BULLET_SPEED,
                  ownerId:msg.id,ownerColor:msg.color,ownerName:msg.name,born:performance.now(),dmg:msg.dmg||20});
  } else if(msg.t === 'hit'){
    if(msg.byId === myId()) showHitMarker();
  } else if(msg.t === 'kill'){
    addKillFeed((msg.killerName||'???') + ' zeszmacił ' + (msg.victimName||'???'));
    if(msg.killerId === myId() && me){
      me.kills++; document.getElementById('kills').textContent = me.kills;
      me.streak = (me.streak||0) + 1;
      me.hp = Math.min(100, me.hp + 15);
      me.dmgUntil = Math.max(me.dmgUntil, performance.now() + 3000);
      if(STREAK_NAMES[me.streak]) announce(STREAK_NAMES[me.streak]);
    }
  } else if(msg.t === 'powerup_spawn'){
    activePowerups[msg.id] = {x:msg.x, y:msg.y, type:msg.type};
  } else if(msg.t === 'powerup_remove'){
    delete activePowerups[msg.id];
  }
}

function addKillFeed(text){
  const el = document.getElementById('killfeed');
  const row = document.createElement('div');
  row.textContent = text;
  el.appendChild(row);
  setTimeout(()=>row.remove(), 4000);
  while(el.children.length > 5) el.removeChild(el.firstChild);
}
function announce(text){
  const el = document.getElementById('announce');
  el.textContent = text;
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
function flashScreen(color){
  const el = document.getElementById('flash');
  el.style.background = color; el.style.transition = 'none';
  requestAnimationFrame(()=>{ el.style.transition = 'background .4s ease'; el.style.background = 'transparent'; });
}
function showHitMarker(){
  const el = document.getElementById('hitmarker');
  el.classList.remove('show'); void el.offsetWidth; el.classList.add('show');
}
function renderEffects(){
  const el = document.getElementById('effects');
  if(!el || !me) return;
  const now = performance.now();
  let html = '';
  if(me.speedUntil > now) html += '<div class="box" style="background:var(--panel);padding:6px 10px;border-radius:8px;font-size:12px">👟 Speed</div>';
  if(me.dmgUntil > now) html += '<div class="box" style="background:var(--panel);padding:6px 10px;border-radius:8px;font-size:12px">🗡️ Damage</div>';
  el.innerHTML = html;
}
function applyPowerup(type){
  const now = performance.now();
  if(type==='heal') me.hp = Math.min(100, me.hp+40);
  if(type==='speed') me.speedUntil = now + 5000;
  if(type==='damage') me.dmgUntil = now + 5000;
  renderEffects();
}
function renderScoreboard(){
  const el = document.getElementById('scoreboard');
  el.style.display = 'block';
  const list = Object.values(peers).map(p=>({name:p.name, kills:p.kills||0, isMe:false}));
  if(me) list.push({name: me.name + ' (Ty)', kills: me.kills, isMe:true});
  list.sort((a,b)=>b.kills-a.kills);
  el.innerHTML = '<h2>WYNIKI (Tab)</h2>' + list.map(p =>
    `<div class="row ${p.isMe?'me':''}"><span>${p.name}</span><span>${p.kills}</span></div>`
  ).join('');
}

function checkPowerupPickup(){
  if(!me || me.hp<=0) return;
  for(const id in activePowerups){
    if(claimed.has(id)) continue;
    const p = activePowerups[id];
    if(Math.hypot(p.x-me.x, p.y-me.y) < PLAYER_R+18){
      claimed.add(id);
      send('pickup', {id});
      applyPowerup(p.type);
    }
  }
}


document.getElementById('musicBtn').onclick = toggleMusic;
document.getElementById('prevMusic').onclick = previousTrack;
document.getElementById('nextMusic').onclick = nextTrack;
setTrack(0, false);

function init(){
  document.getElementById('joinBtn').onclick = join;
  document.getElementById('nameInput').addEventListener('keydown', e=>{if(e.key==='Enter') join();});
  addEventListener('keydown', e=>{
    keys[e.key.toLowerCase()]=true;
    if(e.key === 'Tab'){ e.preventDefault(); showScore = true; }
  });
  addEventListener('keyup', e=>{
    keys[e.key.toLowerCase()]=false;
    if(e.key === 'Tab'){ showScore = false; document.getElementById('scoreboard').style.display='none'; }
  });
  canvas.addEventListener('mousemove', e=>{mouse.x=e.clientX; mouse.y=e.clientY;});
  canvas.addEventListener('mousedown', ()=>{ firing = true; });
  addEventListener('mouseup', ()=>{ firing = false; });
  canvas.addEventListener('touchstart', e=>{ firing = true; const t=e.touches[0]; if(t){mouse.x=t.clientX; mouse.y=t.clientY;}}, {passive:true});
  canvas.addEventListener('touchend', ()=>{ firing = false; }, {passive:true});
  canvas.addEventListener('touchmove', e=>{const t=e.touches[0]; if(t){mouse.x=t.clientX; mouse.y=t.clientY;}}, {passive:true});
  connect();
  requestAnimationFrame(loop);
}

function join(){
  startMusic();
  if(!ws || ws.readyState!==1) return;
  const name = (document.getElementById('nameInput').value || 'Gracz').slice(0,14);
  const pos = spawnPos();
  const color = COLORS[Math.floor(Math.random()*COLORS.length)];
  pending = {name, color, x:pos.x, y:pos.y};
  send('join', {name, color, x:pos.x, y:pos.y});
}

function onDeath(){
  document.getElementById('deadmsg').style.display='block';
  setTimeout(()=>{
    const pos = spawnPos();
    me.x=pos.x; me.y=pos.y; me.hp=100;
    document.getElementById('deadmsg').style.display='none';
  }, 1800);
}

function shoot(){
  if(!me || me.hp<=0) return;
  const now = performance.now();
  if(now - lastShot < SHOOT_COOLDOWN) return;
  lastShot = now;
  const a = me.angle;
  const dmg = now < me.dmgUntil ? 40 : 20;
  bullets.push({x:me.x,y:me.y,vx:Math.cos(a)*BULLET_SPEED,vy:Math.sin(a)*BULLET_SPEED,ownerId:me.id,ownerColor:me.color,ownerName:me.name,born:now,dmg});
  send('shoot', {x:me.x, y:me.y, a, dmg});
}

function loop(t){
  const dt = Math.min(0.05, (loop.last ? (t-loop.last)/1000 : 0.016));
  loop.last = t;

  if(me && me.hp>0){
    let dx=0, dy=0;
    if(keys['w']) dy-=1; if(keys['s']) dy+=1;
    if(keys['a']) dx-=1; if(keys['d']) dx+=1;
    const spd = SPEED * (t < me.speedUntil ? 1.6 : 1);
    if(dx||dy){
      const l=Math.hypot(dx,dy);
      const nx = me.x + dx/l*spd*dt, ny = me.y + dy/l*spd*dt;
      if(!OBSTACLES.some(o=>circleRectCollide(nx, me.y, PLAYER_R, o))) me.x = nx;
      if(!OBSTACLES.some(o=>circleRectCollide(me.x, ny, PLAYER_R, o))) me.y = ny;
    }
    me.x = Math.max(PLAYER_R, Math.min(ARENA.w-PLAYER_R, me.x));
    me.y = Math.max(PLAYER_R, Math.min(ARENA.h-PLAYER_R, me.y));
    const camX = me.x - canvas.width/2, camY = me.y - canvas.height/2;
    me.angle = Math.atan2((mouse.y+camY)-me.y, (mouse.x+camX)-me.x);

    if(firing) shoot();
    if(t - lastPresence > 60){
      lastPresence = t;
      send('presence', {x:me.x, y:me.y, angle:me.angle, hp:me.hp, kills:me.kills});
    }
    checkPowerupPickup();
    renderEffects();
  }

  if(showScore) renderScoreboard();

  bullets = bullets.filter(b => t - b.born < BULLET_LIFE);
  for(const b of bullets){
    const px = b.x, py = b.y;
    b.x += b.vx*dt; b.y += b.vy*dt;
    if(bulletHitsObstacle(px, py, b.x, b.y, BULLET_R)){
      b.born = -99999;
      continue;
    }
    if(me && me.hp>0 && b.ownerId!==me.id){
      if(segmentHitsCircle(px, py, b.x, b.y, me.x, me.y, PLAYER_R+BULLET_R)){
        b.born = -99999;
        me.hp = Math.max(0, me.hp-(b.dmg||20));
        flashScreen('#ff5d6c33');
        send('hit', {targetId: me.id, byId: b.ownerId});
        if(me.hp<=0){
          me.streak = 0;
          send('kill', {killerId: b.ownerId, victimId: me.id, killerName: b.ownerName, victimName: me.name});
          onDeath();
        }
      }
    }
  }
  bullets = bullets.filter(b => b.born !== -99999);

  document.getElementById('hpfill').style.width = (me?Math.max(0,me.hp):100)+'%';
  render();
  requestAnimationFrame(loop);
}

function drawPlayer(p, isMe){
  ctx.beginPath();
  ctx.ellipse(p.x, p.y+PLAYER_R*0.7, PLAYER_R*0.9, PLAYER_R*0.35, 0, 0, 7);
  ctx.fillStyle = 'rgba(0,0,0,.35)';
  ctx.fill();
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.angle||0);
  ctx.beginPath();
  ctx.moveTo(PLAYER_R+8,0); ctx.lineTo(PLAYER_R-2,-5); ctx.lineTo(PLAYER_R-2,5); ctx.closePath();
  ctx.fillStyle = p.color; ctx.fill();
  ctx.restore();
  ctx.beginPath();
  ctx.arc(p.x,p.y,PLAYER_R,0,7);
  ctx.fillStyle = p.color; ctx.fill();
  ctx.lineWidth=2; ctx.strokeStyle = isMe? '#fff':'#00000055'; ctx.stroke();
  const hp = p.hp==null?100:p.hp;
  ctx.fillStyle='#000a'; ctx.fillRect(p.x-18,p.y-PLAYER_R-14,36,5);
  ctx.fillStyle= hp>40? '#4ade80':'#ff5d6c'; ctx.fillRect(p.x-18,p.y-PLAYER_R-14,36*hp/100,5);
  ctx.fillStyle='#dfe6f0'; ctx.font='12px sans-serif'; ctx.textAlign='center';
  ctx.fillText(p.name||'', p.x, p.y-PLAYER_R-18);
}

function render(){
  const bg = ctx.createLinearGradient(0,0,0,canvas.height);
  bg.addColorStop(0,'#0d111c'); bg.addColorStop(1,'#0a0d14');
  ctx.fillStyle = bg;
  ctx.fillRect(0,0,canvas.width,canvas.height);
  if(!me){ return; }
  const camX = me.x - canvas.width/2, camY = me.y - canvas.height/2;
  ctx.save();
  ctx.translate(-camX,-camY);

  ctx.strokeStyle = '#161b26'; ctx.lineWidth=1;
  const gs=60;
  for(let x = Math.floor(camX/gs)*gs; x<camX+canvas.width; x+=gs){ ctx.beginPath(); ctx.moveTo(x,camY); ctx.lineTo(x,camY+canvas.height); ctx.stroke(); }
  for(let y = Math.floor(camY/gs)*gs; y<camY+canvas.height; y+=gs){ ctx.beginPath(); ctx.moveTo(camX,y); ctx.lineTo(camX+canvas.width,y); ctx.stroke(); }

  ctx.strokeStyle = '#2a3140'; ctx.lineWidth=4;
  ctx.strokeRect(0,0,ARENA.w,ARENA.h);

  for(const o of OBSTACLES){
    ctx.fillStyle = 'rgba(0,0,0,.35)';
    ctx.fillRect(o.x+4, o.y+6, o.w, o.h);
    const g = ctx.createLinearGradient(o.x,o.y,o.x,o.y+o.h);
    g.addColorStop(0,'#3d4759'); g.addColorStop(1,'#242b38');
    ctx.fillStyle = g;
    ctx.fillRect(o.x, o.y, o.w, o.h);
    ctx.strokeStyle = '#525d70'; ctx.lineWidth = 2;
    ctx.strokeRect(o.x, o.y, o.w, o.h);
    ctx.strokeStyle = '#00000040'; ctx.lineWidth = 1;
    for(let i=1;i<3;i++){
      ctx.beginPath();
      if(o.w>o.h){ ctx.moveTo(o.x+o.w*i/3,o.y); ctx.lineTo(o.x+o.w*i/3,o.y+o.h); }
      else { ctx.moveTo(o.x,o.y+o.h*i/3); ctx.lineTo(o.x+o.w,o.y+o.h*i/3); }
      ctx.stroke();
    }
  }

  for(const b of bullets){
    ctx.save();
    ctx.shadowColor = b.ownerColor || '#fff';
    ctx.shadowBlur = 10;
    ctx.beginPath(); ctx.arc(b.x,b.y,BULLET_R,0,7);
    ctx.fillStyle = b.ownerColor || '#fff'; ctx.fill();
    ctx.restore();
  }

  for(const id in activePowerups){
    const p = activePowerups[id];
    const meta = POWERUP_TYPES[p.type] || POWERUP_TYPES.heal;
    const bob = Math.sin(performance.now()/300 + p.x) * 3;
    ctx.save();
    ctx.translate(p.x, p.y + bob);
    ctx.beginPath();
    ctx.arc(0,0,17,0,7);
    ctx.fillStyle = meta.color + 'cc';
    ctx.fill();
    ctx.lineWidth = 2; ctx.strokeStyle = '#fff8'; ctx.stroke();
    ctx.font = '20px sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(meta.icon, 0, 1);
    ctx.restore();
  }

  for(const id in peers){
    const p = peers[id];
    if(p.hp>0) drawPlayer(p,false);
  }
  if(me.hp>0) drawPlayer(me,true);

  ctx.restore();
}

init();
</script>
</body>
</html>
